name: Build ESP8266 Smart Home

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Configure arduino-cli and add ESP8266 core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls http://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2

      - name: Install required libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "ArduinoJson@6.21.5"

      # NodeMCU 1.0 (ESP-12E), Flash Size "4MB (FS:2MB OTA:~1019KB)".
      # If this exact eesz value errors out, run:
      #   arduino-cli board details -b esp8266:esp8266:nodemcuv2
      # to see the valid "eesz" option values for your installed core version
      # and swap the value below.
      - name: Compile sketch
        run: |
          arduino-cli compile \
            --fqbn "esp8266:esp8266:nodemcuv2:eesz=4M2M,xtal=80,baud=115200" \
            --output-dir build \
            esp8266_smart_home

      - name: Show build output
        run: |
          echo "=== Build directory ==="
          find build -maxdepth 2 -type f -print

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp8266-smart-home-firmware
          path: |
            build/*.bin
            build/*.elf
          if-no-files-found: error
